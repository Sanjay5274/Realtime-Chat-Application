# ==========================================
# Application
# ==========================================
spring.application.name=chat-backend


# ==========================================
# PostgreSQL
# ==========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ChatApplication}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0000}


# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# Server
# ==========================================
server.port=${PORT:8080}


# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET:MySuperSecretChatApplicationKeyForJwtAuthentication2026}
jwt.expiration=${JWT_EXPIRATION:86400000}
